appId: com.expyrico.app
name: Deals flow — post, search, filter, vote, report
tags:
  - deals
---
- launchApp:
    clearState: true
- runFlow: ./sign-in.yaml
- tapOn: "Deals"
- assertVisible: "Deals"
- tapOn: "+ Post Deal"
- inputText: "Oat"
- tapOn:
    text: "Oat Milk"
    index: 0
- tapOn:
    id: "price"
- inputText: "3.49"
- tapOn:
    id: "store"
- inputText: "Aldi"
- tapOn: "Post Deal to Community"
- assertVisible: "Aldi"
- tapOn: "Search deals"
- inputText: "Oat"
- assertVisible: "Oat Milk"
- tapOn: "Open filters"
- assertVisible: "Filters"
- tapOn: "Apply Filters"
- assertVisible: "Aldi"

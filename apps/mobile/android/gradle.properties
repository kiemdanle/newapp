org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
# New Architecture is required: @react-native-google-signin@13.1.0 is
# TurboModule-only and fails to compile on the legacy bridge. WatermelonDB's
# JSI hang under New Arch is fixed JS-side (jsi: Platform.OS === 'ios' in
# apps/mobile/src/db/index.ts), not by downgrading the app architecture.
newArchEnabled=true
hermesEnabled=true
reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64

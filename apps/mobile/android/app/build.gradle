plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.facebook.react")
    id("com.google.gms.google-services")
}

react {
    root = file("../..")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    def hermescOsDir = org.gradle.internal.os.OperatingSystem.current().isMacOsX()
        ? "osx-bin"
        : org.gradle.internal.os.OperatingSystem.current().isWindows()
            ? "win64-bin"
            : "linux64-bin"
    hermesCommand = file("../../../../node_modules/react-native/sdks/hermesc/${hermescOsDir}/hermesc").absolutePath

    debuggableVariants.set([])

    autolinkLibrariesWithApp()
}

// Bake apps/mobile/.env into BuildConfig for react-native-config.
// dotenv.gradle opens `$project.rootDir/../$envFile`. rootDir is
// apps/mobile/android (settings.gradle), so default ".env" → apps/mobile/.env.
apply from: "../../../../node_modules/react-native-config/android/dotenv.gradle"

def enableProguardInReleaseBuilds = false
def jscFlavor = "org.webkit:android-jsc:+"

def releaseSigningPropertyNames = [
    'RELEASE_STORE_FILE',
    'RELEASE_STORE_PASSWORD',
    'RELEASE_KEY_ALIAS',
    'RELEASE_KEY_PASSWORD',
]
def releaseSigningProperties = releaseSigningPropertyNames.collectEntries { name ->
    [(name): project.findProperty(name) ?: System.getenv(name)]
}
def hasReleaseSigningProperties = releaseSigningProperties.values().every { it }

def requireReleaseSigningProperties = {
    if (!hasReleaseSigningProperties) {
        def missing = releaseSigningPropertyNames.findAll { !releaseSigningProperties[it] }
        throw new GradleException("Release signing requires: ${missing.join(', ')}")
    }
}

gradle.taskGraph.whenReady { graph ->
    def buildsReleaseVariant = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }
    if (buildsReleaseVariant) requireReleaseSigningProperties()
}

android {
    namespace "com.expyrico.app"
    compileSdk rootProject.ext.compileSdkVersion

    // AGP 8+ disables BuildConfig by default; react-native-config reads env
    // fields from com.expyrico.app.BuildConfig via reflection.
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.expyrico.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.0.1"
        manifestPlaceholders = [ENVFILE: project.findProperty('ENVFILE') ?: '.env']
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // Phase 5: @google-cloud/recaptcha-enterprise-react-native's AAR requires
    // core library desugaring (its metadata check fails the build otherwise
    // — proven empirically via the Task 1 native proof build, not assumed).
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (hasReleaseSigningProperties) {
                storeFile file(releaseSigningProperties.RELEASE_STORE_FILE)
                storePassword releaseSigningProperties.RELEASE_STORE_PASSWORD
                keyAlias releaseSigningProperties.RELEASE_KEY_ALIAS
                keyPassword releaseSigningProperties.RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Latest published version as of this pin (dl.google.com/android/maven2
    // metadata) — required by coreLibraryDesugaringEnabled above.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
